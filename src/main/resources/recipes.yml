# Las armas, armaduras de bosses y tributos no tienen receta.
# El equipo sigue disponible como botín y con /ri equipo.
# shape e ingredients son opcionales. Los símbolos originales no redefinidos conservan su ExactChoice.
schema-version: 4
recipes:
  brujula_caza:
    enabled: true
    # F = fragmento de tributo; D = diamante; E = esmeralda;
    # C = brújula normal; I = lingote de hierro; R = redstone.
    shape: [FDF, ECI, FRF]
