name: CazaJefes
version: '1.13.0'
main: dev.cazajefes.CazaJefesPlugin
api-version: '1.21'
description: Jefes grandes con ataques especiales, botín y recetas.
authors: [CazaJefes]
commands:
  riequipo:
    description: Entrega equipo por categoría a administradores.
    usage: /riequipo <epico|legendario|mitico|abismal> [armadura|espada|hacha|todo] [jugador]
  mercado:
    description: Mercado de la Grieta por categorías.
    aliases: [grieta]
  bestiario:
    description: Bestiario por categorías.
    aliases: [bestirio, bestiary]
  rares:
    description: Abre recetas y forja de rares.
    usage: /rares
  ri:
    description: Caza jefes, rastrea sus huevos y forja reliquias.
    usage: /ri <help|egg|boss|compass|essence|book|fragment|tribute|rare>
    aliases: [cazajefes]
permissions:
  cazajefes.hunter.hatch:
    description: Permite despertar huevos propios de CazaJefes sin OP.
    default: true
  cazajefes.admin:
    description: Acceso administrativo completo de CazaJefes.
    default: op
    children:
      cazajefes.admin.*: true
  cazajefes.admin.*:
    default: op
    children:
      cazajefes.admin.spawnpoint: true
      cazajefes.admin.egg: true
      cazajefes.admin.boss: true
      cazajefes.admin.compass: true
      cazajefes.admin.essence: true
      cazajefes.admin.reload: true
      cazajefes.admin.equipment: true
      cazajefes.admin.diagnostico: true
  cazajefes.admin.spawnpoint:
    default: op
  cazajefes.admin.egg:
    default: op
  cazajefes.admin.boss:
    default: op
  cazajefes.admin.compass:
    default: op
  cazajefes.admin.essence:
    default: op
  cazajefes.admin.reload:
    default: op
  cazajefes.admin.equipment:
    default: op
  cazajefes.admin.diagnostico:
    default: op
  rareitemhunter.admin.*:
    description: Acceso administrativo compatible con RareItemHunter.
    default: op
    children:
      rareitemhunter.admin.spawnpoint: true
      rareitemhunter.admin.egg: true
      rareitemhunter.admin.boss: true
      rareitemhunter.admin.compass: true
      rareitemhunter.admin.essence: true
      rareitemhunter.admin.reload: true
  rareitemhunter.admin.spawnpoint:
    default: op
  rareitemhunter.admin.egg:
    default: op
  rareitemhunter.admin.boss:
    default: op
  rareitemhunter.admin.compass:
    default: op
  rareitemhunter.admin.essence:
    default: op
  rareitemhunter.admin.reload:
    default: op
  rareitemhunter.admin.notify:
    default: op
  rareitemhunter.hunter.compass:
    default: true
  rareitemhunter.hunter.*:
    default: true
    children:
      rareitemhunter.hunter.compass: true
      rareitemhunter.hunter.hatch: true
      rareitemhunter.hunter.craft: true
  rareitemhunter.hunter.hatch:
    default: true
  rareitemhunter.hunter.craft:
    default: true
