schema-version: 3
bosses:
  attack-interval-ticks: 10
  gorath_quebrantador_de_mundos:
    scale: 2.0
    health: 2500.0
    damage: 12.0
  nyxara_tejedora_del_ocaso:
    scale: 1.65
    health: 1700.0
    damage: 9.0
  varkhos_vigia_de_las_cenizas:
    scale: 1.7
    health: 1100.0
    damage: 10.0
spawnpoints: {}
active-eggs: []

# Target acquisition: 24 blocks + line of sight; phase thresholds: 65% / 30%.
combat:
  cave-breach: true
  pillager-rocket-charges: 6
  death-break-cave-roof: true
  # IDs existentes de WorldGuard, por ejemplo [arena_gorath].
  worldguard-arenas: []
  pillager-retaliation-hits: 5
  # Creative damage/loot tests require cazajefes.admin; survival targeting is unchanged.
  allow-creative-admin-tests: true
  # No se aplica regreso al origen: bosses libres también en el agua.
  # Especiales: 10 s. Definitivos: 15 s desde el final de su ejecución.
  loot-credit-seconds: 120
  final-inventory-chance: 0.02
  phase3-lightning:
    enabled: true
    threshold-damage: 40
    cooldown-seconds: 4
    max-damage: 30

loot:
  boss-heart-chance: 0.01
  mob-fragment-chance: 0.01
  minion-fragment-chance: 0.005

market:
  sigil-fragments: 64
  amulet-sigils: 4
  amulet-tributes: 8

# Auras ambientales; las advertencias de combate siguen independientes.
particles:
  auras:
    enabled: true
    default-quality: media
    interval-ticks: 10
    radius: 32
    max-bosses-per-player: 2
    max-sends-per-player-second: 160
    max-sends-per-frame: 1024

messages:
  attack: '<gold><bold><state></bold></gold> <dark_gray>·</dark_gray> <white><attack></white>'

# Idioma de los avisos, menús y combate del plugin.
language:
  force-spanish: true

# Presentación y libros; recargar con /ri reload.
presentation:
  sanctuary:
    title: Santuario del Renacer
    pane: BLUE_STAINED_GLASS_PANE
    sigil-slot: 21
    amulet-slot: 23
  greaterburst:
    stars: 32
    frames: 2
    period-ticks: 4
    star-size: 0.045
    particle-size: 0.35
    expansion: 0.18
books:
  sharing:
    enabled: true
    range: 24
    targeting-width: 0.65
    sender-message: 'Has dado {effect} a {player}.'
    receiver-message: 'Has recibido {effect} de {player}.'
  greaterburst:
    radius-base: 5
    radius-per-level: 2
    force-base: 1.25
    force-per-level: 0.35
    lift-base: 0.65
    lift-per-level: 0.18
  invisibility:
    duration-ticks: 1200
  fireresistance:
    duration-per-level-ticks: 900
