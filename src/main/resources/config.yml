schema-version: 2
bosses:
  attack-interval-ticks: 10
  gorath_quebrantador_de_mundos:
    scale: 2.0
    health: 2500.0
    damage: 12.0
  nyxara_tejedora_del_ocaso:
    scale: 1.65
    health: 1700.0
    damage: 9.0
  varkhos_vigia_de_las_cenizas:
    scale: 1.7
    health: 1100.0
    damage: 10.0
spawnpoints: {}
active-eggs: []

# Target acquisition: 24 blocks + line of sight; phase thresholds: 65% / 30%.
combat:
  # Creative damage/loot tests require cazajefes.admin; survival targeting is unchanged.
  allow-creative-admin-tests: true
  # No se aplica regreso al origen: bosses libres también en el agua.
  # Especiales: 10 s. Definitivos: 15 s desde el final de su ejecución.
  loot-credit-seconds: 120
  final-inventory-chance: 0.02
  phase3-lightning:
    enabled: true
    threshold-damage: 40
    cooldown-seconds: 4
    max-damage: 30

loot:
  boss-heart-chance: 0.01
  mob-fragment-chance: 0.01
  minion-fragment-chance: 0.005

market:
  sigil-fragments: 64
  amulet-sigils: 4
  amulet-tributes: 8

# Auras ambientales; las advertencias de combate siguen independientes.
particles:
  auras:
    enabled: true
    default-quality: media
    interval-ticks: 10
    radius: 32
    max-bosses-per-player: 2
    max-sends-per-player-second: 160
    max-sends-per-frame: 1024
