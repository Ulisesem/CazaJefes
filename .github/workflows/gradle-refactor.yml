name: Gradle testRefactor
on:
  push:
    branches: [testRefactor]
  pull_request:
    branches: [testRefactor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: CazaJefes
          path: CazaJefes/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CazaJefes-api
          path: api/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CazaJefes-pluginExample
          path: pluginExample/build/libs/*.jar
          if-no-files-found: error
