name: Build and Test
on:
  push:
    branches: [main, DLUpdates, 'feature/*', 'fix/*']
    paths-ignore: ['**.md', 'docs/**', 'resourcepack/**']
  pull_request:
    branches: [main, DLUpdates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build with Gradle
        run: gradle --no-daemon clean build

      - name: Upload CazaJefes JAR
        uses: actions/upload-artifact@v7
        with:
          name: CazaJefes
          path: CazaJefes/build/libs/*.jar
          archive: false
          if-no-files-found: error

      - name: Upload API JAR
        uses: actions/upload-artifact@v7
        with:
          name: CazaJefes-api
          path: api/build/libs/*.jar
          archive: false
          if-no-files-found: error

      - name: Upload PluginExample JAR
        uses: actions/upload-artifact@v7
        with:
          name: CazaJefes-pluginExample
          path: pluginExample/build/libs/*.jar
          archive: false
          if-no-files-found: error

      - name: Upload AI JAR
        uses: actions/upload-artifact@v7
        with:
          name: CazaJefes-ai
          path: ai/build/libs/*.jar
          archive: false
          if-no-files-found: error
