sourceSets {
    main {
        java.setSrcDirs([rootProject.file('src/main/java')])
        resources.setSrcDirs([rootProject.file('src/main/resources')])
    }
    test {
        java.setSrcDirs([rootProject.file('src/test/java')])
        resources.setSrcDirs([rootProject.file('src/test/resources')])
    }
}
dependencies {
    implementation project(':api')
    implementation project(':ai')
    testImplementation "io.papermc.paper:paper-api:${rootProject.property('paperVersion')}"
    testImplementation 'junit:junit:4.13.2'
}
tasks.named('jar') {
    dependsOn ':api:classes', ':ai:classes'
    from project(':ai').sourceSets.main.output
    from project(':api').sourceSets.main.output
}

tasks.named('test') { workingDir rootProject.projectDir }
